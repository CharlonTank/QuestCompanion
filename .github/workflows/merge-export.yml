name: Fusion des contributions

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  merge:
    if: startsWith(github.event.issue.title, '[export]') || startsWith(github.event.issue.title, '[route]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fusionner un export QueteCibles (liens quete -> mobs / PNJ)
        if: startsWith(github.event.issue.title, '[export]')
        env:
          EXPORT_TEXT: ${{ github.event.issue.body }}
        run: node tools/merge-export.js

      - name: Fusionner un parcours QueteRoute (route communautaire)
        if: startsWith(github.event.issue.title, '[route]')
        env:
          EXPORT_TEXT: ${{ github.event.issue.body }}
          CONTRIB: ${{ github.event.issue.user.login }}
        run: node tools/merge-route.js

      - name: Commit et push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QueteCibles/Data.lua QueteRoute/Route.lua route-data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Fusion contribution issue #${{ github.event.issue.number }} (@${{ github.event.issue.user.login }})"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commenter et fermer l'issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESUME=$(cat merge-summary.txt)
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            gh issue comment ${{ github.event.issue.number }} --body "Merci ! Contribution fusionnée : $RESUME"
            gh issue close ${{ github.event.issue.number }}
          else
            gh issue comment ${{ github.event.issue.number }} --body "Rien de nouveau à ajouter ($RESUME). Vérifie que le texte collé vient bien de /cibles export ou /route export."
          fi
